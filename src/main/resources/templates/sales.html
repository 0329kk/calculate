<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>売上データ一覧</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<style>
		form {
			margin-bottom: 20px;
		}

		label {
			display: block;
			margin-top: 5px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th,
		td {
			padding: 8px;
			text-align: left;
		}
	</style>
</head>

<body>
	<h1>売上データ一覧</h1>
	<!-- 売上データ追加フォーム -->
	<h2>売上データの追加</h2>
	<form th:action="@{/sales/add}" method="post">
		<label>商品名: <input type="text" name="productName" /></label><br />
		<label>数量: <input type="number" name="quantity" /></label><br />
		<label>単価: <input type="number" step="1" name="price" /></label><br />
		<label>日付: <input type="date" name="date" /></label><br />
		<input type="submit" value="追加" />
	</form>
	<form th:action="@{/sales/saveToFile}" method="get">
		<button type="submit">データをテキストファイルに保存</button>
	</form>
	<table border="1">
		<tr>
			<th>商品名</th>
			<th>数量</th>
			<th>単価</th>
			<th>日付</th>
		</tr>
		<tr th:each="record : ${salesRecords}">
			<td th:text="${record.productName}"></td>
			<td th:text="${record.quantity}"></td>
			<td th:text="${record.formattedPrice}"></td>
			<td th:text="${record.formattedDate}"></td>
			<td>
				<!-- 編集ボタン -->
				<form th:action="@{/sales/edit}" method="get" style="display:inline;">
					<input type="hidden" name="id" th:value="${record.id}" />
					<button type="submit">編集</button>
				</form>
				<!-- 削除ボタン -->
				<form th:action="@{/sales/delete}" method="post" style="display:inline;">
					<input type="hidden" name="id" th:value="${record.id}" />
					<button type="submit" onclick="return confirm('このデータを削除しますか？')">削除</button>
				</form>
			</td>
		</tr>
	</table>
	<canvas id="salesChart" width="400" height="200"></canvas>
	<script th:inline="javascript">
		// ThymeleafからデータをJSON形式で受け取る
		var productNames = /*[[${productNames}]]*/ '[]';
		var salesAmounts = /*[[${salesAmounts}]]*/ '[]';

		// 売上金額の最大値を取得し、Y軸の最大値を設定
		var maxAmount = Math.max(...salesAmounts) || 0;
		var yAxisMax = maxAmount > 500 ? maxAmount + 500 : 1000; // 最小で1000円まで表示

		// Chart.js の設定
		var ctx = document.getElementById('salesChart').getContext('2d');
		var salesChart = new Chart(ctx, {
			type: 'line',  // 折れ線グラフに設定
			data: {
				labels: productNames,  // 商品名をラベルに設定
				datasets: [{
					label: '売上額 (円)',
					data: salesAmounts,  // 売上額をデータに設定
					borderColor: 'rgba(75, 192, 192, 1)', // 線の色
					backgroundColor: 'rgba(75, 192, 192, 0.2)', // 点の背景色
					borderWidth: 2, // 線の太さ
					pointBackgroundColor: 'rgba(75, 192, 192, 1)', // 点の色
					pointRadius: 5, // 点の大きさ
					fill: false // 塗りつぶしなし
				}]
			},
			options: {
				scales: {
					y: {
						beginAtZero: true,
						max: yAxisMax, // Y軸の最大値を設定
						ticks: {
							stepSize: 500,  // ステップサイズを500円に設定
							callback: function (value, index, values) {
								return '¥' + value;  // Y軸に円マークをつける
							}
						}
					}
				}
			}
		});
	</script>
