<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>データ編集</title>
</head>
<body>
    <h1>売上データの編集</h1>
    <form th:action="@{/sales/update}" method="post">
        <input type="hidden" name="id" th:value="${salesRecord.id}" />
        <label>商品名: <input type="text" name="productName" th:value="${salesRecord.productName}" /></label><br />
        <label>数量: <input type="number" name="quantity" th:value="${salesRecord.quantity}" /></label><br />
        <label>単価: <input type="number" step="1" name="price" th:value="${salesRecord.price}" /></label><br />
        <label>日付: <input type="date" name="date" th:value="${salesRecord.date}" /></label><br />
        <input type="submit" value="更新" />
    </form>
</body>
</html>
